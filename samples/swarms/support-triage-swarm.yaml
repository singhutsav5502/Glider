kind: swarm_template
id: support-triage-swarm
name: Customer support ticket triage
enabled: true
prefer_local: true
max_workers: 3
roles:
  - plan
  - exec
  - research
prompt: |
  Customer ticket: "Our Cursor Agent sometimes answers from Ollama when we typed /cloud.
  Dashboard shows sticky cloud but follow-on summary looks local. Please triage."
  Roles: plan (hypothesis tree), exec (repro steps + config checks), research (related
  sticky/summary chrome causes). Produce actionable triage notes.
  Prefer context_query / [context_digest] for shared goal. Write the triage pack with
  artifact_write kind=out under runs/<turn-id>/out/ (bare paths ScopeRel to work/).
  Optional: web_search only for known Cursor sticky/routing docs — do not invent product bugs.
tools:
  - name: artifact_write
    kind: builtin
  - name: fs_list
    kind: builtin
  - name: fs_read
    kind: builtin
  - name: context_query
    kind: builtin
  - name: web_search
    kind: builtin
description: Support triage swarm for Path B sticky/routing confusion tickets.
