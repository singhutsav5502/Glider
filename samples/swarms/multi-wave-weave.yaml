kind: swarm_template
id: multi-wave-weave
name: Multi-wave weave (plan then execute)
enabled: true
prefer_local: true
max_workers: 2
waves: 3
weave_policy: conflict_callouts
decompose: true
free_spawn: true
roles:
  - plan
  - exec
prompt: |
  Goal: ship a durable Slate-style weave demo for Glider.

  Wave 0 (plan): produce a SHORT numbered plan (3 steps max) covering:
  1) [role:research] inspect contextgraph dual-layer query + explain surface
  2) role=exec run a free-spawn FanOut and weave with conflict callouts
  3) @security verify thread resume after restart (list + resume APIs)

  Later waves free-spawn invented roles from the plan. Call out GO vs NO-GO
  clearly so conflict_callouts can surface polarity disagreements.
description: |
  Sample multi-wave weave with planner decomposition, free_spawn roles, and conflict_callouts.
  POST /api/swarm/run {"template_id":"multi-wave-weave","waves":3,"decompose":true,"free_spawn":true}
  LLM critic: {"weave_policy":"llm_critic",...}
  Resume: POST /api/swarm/threads/{id}/resume {"waves":1}
