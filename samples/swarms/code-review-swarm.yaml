kind: swarm_template
id: code-review-swarm
name: Multi-agent code review
enabled: true
prefer_local: true
max_workers: 4
roles:
  - plan
  - security
  - tests
  - docs
prompt: |
  Review the following change for a Go MITM/gateway harness (Glider). Cover design risks,
  security (MITM CA, secrets), test gaps, and docs impact. Keep each role under 150 words.
  Change summary: added per-instance agent logs, CritiqueMerge, parallel actor stages,
  Cytoscape undo/history, and showcase hoop samples.

  Paths: bare files ScopeRel to runs/<turn-id>/work/; write role notes with artifact_write
  kind=out under runs/<turn-id>/out/. Prefer context_query / [context_digest] for shared
  goal/plan. Optional: code_grep / fs_read if inspecting sample paths under work/.
tools:
  - name: artifact_write
    kind: builtin
  - name: fs_list
    kind: builtin
  - name: fs_read
    kind: builtin
  - name: code_grep
    kind: builtin
  - name: context_query
    kind: builtin
description: Fan-out code review with plan/security/tests/docs roles; CritiqueMerge on fan-in.
