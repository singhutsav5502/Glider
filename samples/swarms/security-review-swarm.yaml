kind: swarm_template
id: security-review-swarm
name: Enterprise security review (multi-role fan-in)
enabled: true
prefer_local: true
max_workers: 4
roles:
  - threat
  - authz
  - secrets
  - blast
prompt: |
  Security review for a proposed change to Glider's MITM Agent fulfill hub and sticky-cloud
  Path B policy. Change summary: longer sticky TTL (90s to 10m), persist last user prompt hash
  to disk under ~/.glider/sticky for debugging, and allow subagent sticky inheritance across
  composer tabs. Enterprise context: SOC2 in progress; customer data may appear in Agent
  prompts; MITM terminates TLS with local CA.

  Each role must return a labeled section (ROLE: <name>, <=150 words) covering:
  - threat: STRIDE-style abuse cases + attacker who controls a compromised workspace
  - authz: who can enable/disable sticky persistence; multi-user laptop risk
  - secrets: CA private key, API keys, prompt hashes at rest, log redaction
  - blast: rollback, kill-switch, customer notification triggers

  End with a shared GO / NO-GO / GO-WITH-CONTROLS recommendation (one line). Do not invent
  CVEs. Prefer concrete mitigations Glider can implement (flags, TTL, encryption at rest).
description: |
  Multi-role security fan-out (threat/authz/secrets/blast) with CritiqueMerge on fan-in.
  Enterprise-flavored Path B / sticky persistence review.
