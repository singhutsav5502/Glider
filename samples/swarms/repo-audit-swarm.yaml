kind: swarm
id: repo-audit-swarm
name: Repo audit swarm (quality + security + secrets)
prompt: |
  Audit https://github.com/singhutsav5502/Unbrokify.git for code quality,
  security, and secrets exposure.
  Clone once with git_clone into bare dest audit-target (ScopeRel maps it to
  runs/<this-turn-id>/work/audit-target — never workspace-root audit-target/).
  Prefer context_query key=clone_path|goal|plan|file-tree after clone; workers must
  not re-clone. Use code_grep / fs_list / fs_read under audit-target/. Write the
  merged brief with artifact_write kind=out (e.g. out audit-brief.md) under
  runs/<turn-id>/out/. Optional: web_search for vuln class names only — do not
  invent CVEs. Prefer tools (git_clone, code_grep, fs_*, GitHub MCP). Cite paths.
  No questions to the operator — produce Severity, Findings by role, Priority fixes.
roles: [research, exec, plan]
max_workers: 3
prefer_local: true
enabled: true
waves: 1
weave_policy: critic
tools:
  - name: git_clone
    kind: builtin
  - name: code_grep
    kind: builtin
  - name: fs_search
    kind: builtin
  - name: fs_list
    kind: builtin
  - name: fs_read
    kind: builtin
  - name: artifact_write
    kind: builtin
  - name: context_query
    kind: builtin
  - name: web_search
    kind: builtin
  - name: "*"
    kind: mcp
    server: github
