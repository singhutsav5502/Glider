kind: hoop
id: hello-critic
name: Hello Critic (smoke)
goal: >
  Produce a one-sentence greeting that includes the word "glider", then have the
  critic verify the greeting is complete and contains that word.
prompt: >
  Write exactly one friendly sentence that greets the user and includes the
  lowercase word glider. No markdown, no bullet list.
route: local
learning: false
autonomy: L1
human_gate: true
max_iterations: 2
fail_policy: stop
enabled: true
eval:
  min_score: 0.5
  goal: Greeting must be one sentence and contain "glider".
stages:
  - kind: router
    name: Prefer local
    route: local
  - kind: planner
    name: Plan greeting
    prompt: Plan the shortest valid greeting that satisfies the goal.
    route: local
  - kind: actor
    name: Write greeting
    prompt: Emit only the greeting sentence.
    route: local
  - kind: critic
    name: Score greeting
    prompt: >
      Score 0.0–1.0. Require a single sentence containing the word glider.
      Reply with SCORE=x.xx and one line of rationale.
    route: local
  - kind: memory
    name: Persist
