kind: hoop
id: parallel-swarm-mode
name: Parallel swarm mode demo
goal: |
  Tiny hoop showing parallel_mode: swarm (nested swarm.Runner) plus a context seed stage.
  Prefer local models. No clone required.
route: local
learning: false
max_iterations: 1
autonomy: L2
human_gate: false
graph_version: "1"
topology: loop
fail_policy: continue
eval:
  goal: Merged worker output mentions DONE or ROLE
  min_score: 0.5
  on_fail_n: 2
stop_conditions:
  on_success_n: 1
  max_latency_ms: 120000
stages:
  - id: memory_load
    kind: memory
  - id: router
    kind: router
    route: local
  - id: planner
    kind: planner
    prompt: |
      Produce a 2-bullet plan for a short dual-role review of the GOAL.
  - id: context_seed
    kind: context
    name: Seed shared contextgraph
    # Upserts goal/plan into contextgraph; workers use context_query / [context_digest].
  - id: swarm_actors
    kind: actor
    name: Nested swarm fan-out
    parallel: 2
    parallel_mode: swarm
    # Optional nested-runner knobs (waves ≤ 1 → Runner.Run; >1 → RunWaves):
    # swarm:
    #   template_id: optional-template
    #   waves: 1
    #   weave_policy: critic   # used when waves > 1
    #   prefer_local: true
    #   models: [qwen2.5-coder:7b, qwen2.5-coder:7b]
    roles: [exec, research]
    tools:
      - name: artifact_write
        kind: builtin
      - name: datetime
        kind: builtin
    prompt: |
      You are one worker. Answer briefly with ROLE: <name> and the word DONE.
      Use [context_digest] / context_query key=goal|plan if present; do not invent tools.
      Optional: artifact_write kind=out a one-line note under runs/parallel-swarm-mode/out/
      (bare paths ScopeRel to runs/<hoop-id>/work/).
  - id: critic
    kind: critic
    eval_min: 0.5
  - id: memory_persist
    kind: memory
graph_edges:
  - { id: e0, source: memory_load, target: router, kind: flow }
  - { id: e1, source: router, target: planner, kind: flow }
  - { id: e2, source: planner, target: context_seed, kind: flow }
  - { id: e3, source: context_seed, target: swarm_actors, kind: flow }
  - { id: e4, source: swarm_actors, target: critic, kind: flow }
  - { id: e5, source: critic, target: memory_persist, kind: flow }
enabled: true
