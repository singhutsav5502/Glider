kind: hoop
id: compliance-evidence-pack
name: Compliance evidence pack (SOC2 / change control)
goal: |
  Assemble an audit-ready evidence pack for a material production change. Scenario: Engineering
  shipped "Glider sticky-cloud summary routing" (PR #1847) to production on 2026-07-12. Change
  touches MITM fulfill hub and Path B sticky policy. Auditor (external SOC2 Type II) asks for:
  (a) change ticket + approval trail, (b) risk assessment, (c) test evidence, (d) rollback plan,
  (e) monitoring / alerting hooks, (f) data classification note (does sticky state store prompts?).
  Known facts only: ticket CHG-4421 approved by eng-manager + platform-oncall; unit tests in
  agent_fulfill_hub_test.go; e2e path_b sticky cases green on CI run 88921; rollback = revert
  PR #1847 + disable agent_rpc_fulfill flag; metrics bidi_sticky_cloud_* exist; sticky TTL ~90s;
  no long-term prompt store claimed in design docs. Produce a pack an auditor can skim in
  10 minutes. Prefer local models.
route: local
learning: true
max_iterations: 3
autonomy: L1
human_gate: true
fail_policy: stop
eval:
  goal: |
    Pack includes Change summary, Risk, Approvals, Tests, Monitoring, Rollback, Data class,
    Evidence gaps; SCORE >= 0.78
  min_score: 0.78
  on_fail_n: 2
stop_conditions:
  on_success_n: 1
  max_latency_ms: 210000
  contains: ["CHG-4421", "Rollback", "Evidence"]
stages:
  - id: memory_load
    kind: memory
    name: Load prior compliance notes
  - id: router
    kind: router
    name: Route
    route: local
  - id: evidence_plan
    kind: planner
    name: Evidence collection plan
    prompt: |
      You are a compliance analyst (planner). Produce a checklist of evidence artifacts mapped
      to SOC2 change-management control themes (authorization, testing, monitoring, rollback,
      data handling). Mark each item AVAILABLE / PARTIAL / MISSING based only on given facts.
      List questions for the human gate. Do not invent ticket IDs beyond CHG-4421 / PR #1847.
  - id: pack_writer
    kind: actor
    name: Draft evidence pack
    parallel: 2
    roles: [exec, research]
    prompt: |
      Follow the PLAN. Write the evidence pack with fixed headings:
      1) Change summary 2) Risk assessment 3) Approvals trail 4) Test evidence
      5) Monitoring & alerts 6) Rollback 7) Data classification 8) Evidence gaps / follow-ups
      Role bias: exec focuses on operational rollback/monitoring; research focuses on control
      mapping and gaps. Under 500 words total. No fake screenshots or forged signatures.
  - id: auditor_critic
    kind: critic
    name: External-auditor critic
    eval_min: 0.78
    prompt: |
      You are an external auditor checker (not the author). Score whether this pack is usable
      for a walkthrough tomorrow. Penalize invented evidence, missing rollback, or vague data
      classification. Reply exactly:
      SCORE: <0.0-1.0>
      REASON: <one short sentence>
  - id: memory_persist
    kind: memory
    name: Persist pack draft
graph_edges:
  - id: e1
    source: memory_load
    target: router
    kind: flow
  - id: e2
    source: router
    target: evidence_plan
    kind: flow
  - id: e3
    source: evidence_plan
    target: pack_writer
    kind: flow
  - id: e4
    source: pack_writer
    target: auditor_critic
    kind: flow
  - id: e5
    source: auditor_critic
    target: memory_persist
    kind: flow
  - id: fb1
    source: auditor_critic
    target: evidence_plan
    kind: feedback
skill: compliance-evidence-pack-v1
