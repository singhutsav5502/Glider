kind: hoop
id: explain-snippet
name: Explain snippet
goal: >
  Explain what the provided Go function does in 2–4 plain sentences for a junior
  developer. No code rewrite.
prompt: >
  Explain this function:

  func clamp(n, lo, hi int) int {
      if n < lo { return lo }
      if n > hi { return hi }
      return n
  }
route: local
learning: false
autonomy: L1
max_iterations: 2
fail_policy: stop
enabled: true
eval:
  min_score: 0.55
  goal: Explanation mentions bounds/limits without rewriting the code.
stages:
  - kind: planner
    prompt: List the behaviors to cover (below/inside/above range).
    route: local
  - kind: actor
    prompt: Write the explanation in 2–4 sentences. No code fences.
    route: local
  - kind: critic
    prompt: >
      SCORE=0–1. Pass if the answer explains clamping to [lo,hi] clearly.
      Fail if it only pastes code or invents APIs.
    route: local
