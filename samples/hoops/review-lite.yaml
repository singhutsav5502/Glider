kind: hoop
id: review-lite
name: Review lite
goal: >
  Perform a light code review of a tiny diff. Actor lists issues; critic checks
  that findings are concrete (file/line or pattern) not vague praise.
prompt: >
  Review this change:

  - func Add(a, b int) int { return a - b }  // intentional bug sample

  List bugs, risks, and a one-line fix suggestion. Be concise.
route: local
learning: false
autonomy: L1
max_iterations: 3
fail_policy: stop
enabled: true
eval:
  min_score: 0.6
  goal: Must notice subtraction instead of addition (or equivalent concrete bug).
stages:
  - kind: planner
    prompt: Decide what to look for (correctness, naming, tests).
    route: local
  - kind: actor
    prompt: Write a short review with findings and a fix suggestion.
    route: local
  - kind: critic
    prompt: >
      SCORE=0–1. High score only if the review catches the a-b vs a+b mistake
      (or clearly states arithmetic wrong). Vague "looks fine" → low score.
    route: local
