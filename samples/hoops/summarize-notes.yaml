kind: hoop
id: summarize-notes
name: Summarize notes
goal: >
  Turn messy notes into exactly three takeaways. Critic verifies count and clarity.
prompt: >
  Notes:
  - shipping sticky cloud for composer wrap-ups
  - locals get latest turn + episodes not full TipTap
  - hoops are loop-engineering stages with eval scores
  - still need Path B tool-loop fulfill
  - pure local profile uses glider.local.yaml

  Produce exactly 3 takeaway bullets for a teammate who missed standup.
route: local
learning: false
autonomy: L1
max_iterations: 2
fail_policy: stop
enabled: true
eval:
  min_score: 0.55
  goal: Exactly three clear takeaways; no more than five bullets total.
stages:
  - kind: actor
    prompt: Emit exactly three markdown bullets. No preamble.
    route: local
  - kind: critic
    prompt: SCORE=0–1. Count bullets; prefer exactly 3 substantive takeaways.
    route: local
