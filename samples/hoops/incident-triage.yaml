kind: hoop
id: incident-triage
name: Incident triage / on-call runbook
goal: |
  You are on-call. Triage the following simulated incident and produce an actionable runbook
  response. Incident: API gateway p99 latency spiked to 4.2s for 12 minutes starting 01:14 UTC;
  error rate 2.8% on /v1/checkout; recent deploy of payments-service v2.14.3 at 00:55 UTC;
  Datadog shows elevated DB connection wait; no SEV-1 declared yet.
route: local
learning: true
max_iterations: 3
autonomy: L1
human_gate: true
fail_policy: stop
eval:
  goal: Runbook has severity, blast radius, immediate mitigations, and next checks; SCORE >= 0.75
  min_score: 0.75
  on_fail_n: 2
stop_conditions:
  on_success_n: 1
  max_latency_ms: 180000
stages:
  - id: memory_load
    kind: memory
    name: Load incident context
  - id: router
    kind: router
    name: Route
    route: local
  - id: planner
    kind: planner
    name: Triage plan
    prompt: |
      You are the incident commander planner. Produce a short triage plan:
      1) severity hypothesis 2) blast radius questions 3) ordered checks 4) rollback vs mitigate.
      Do not invent metrics that were not provided.
  - id: actor
    kind: actor
    name: Runbook draft
    parallel: 2
    roles: [exec, research]
    prompt: |
      You are the on-call implementer. Follow the PLAN. Draft a runbook reply with sections:
      Severity, Impact, Immediate actions, Checks, Comms template, Rollback decision.
      Keep it under 400 words. Prefer concrete commands over theory.
  - id: critic
    kind: critic
    name: Safety critic
    eval_min: 0.75
    prompt: |
      You are the checker (not the maker). Score whether the runbook is safe and complete
      for a SEV-2 candidate. Reply with exactly two lines:
      SCORE: <0.0-1.0>
      REASON: <one short sentence>
  - id: memory_persist
    kind: memory
    name: Persist outcome
graph_edges:
  - id: e1
    source: memory_load
    target: router
    kind: flow
  - id: e2
    source: router
    target: planner
    kind: flow
  - id: e3
    source: planner
    target: actor
    kind: flow
  - id: e4
    source: actor
    target: critic
    kind: flow
  - id: e5
    source: critic
    target: memory_persist
    kind: flow
  - id: fb1
    source: critic
    target: planner
    kind: feedback
skill: oncall-runbook-v1
