kind: hoop
id: enterprise-incident-command
name: Enterprise incident command (SEV)
goal: |
  You are Incident Commander for a multi-region SaaS outage. Produce a command-channel
  brief that ops, eng, and exec can act on. Scenario (treat as given facts only - do not invent
  metrics): At 02:41 UTC, checkout success rate fell from 98.4% to 71% across us-east-1 and
  eu-west-1. p99 API gateway latency 6.8s. Error signature: Postgres connection pool exhaustion
  on payments-db primary; replica lag 42s. Change window: feature flag payments.async_capture
  enabled at 02:28 UTC for 100% traffic; Terraform apply on RDS parameter group at 02:15 UTC
  (max_connections 500->800). Customer Slack #sev rising; no public status page update yet.
  Legal asks whether PII was exposed (no evidence yet). Goal: severity, blast radius, parallel
  workstreams, mitigate vs rollback, comms, and next decision time.
route: local
learning: true
max_iterations: 4
autonomy: L1
human_gate: true
fail_policy: stop
eval:
  goal: |
    Brief has Severity, Blast radius, Parallel workstreams, Immediate mitigations,
    Rollback decision, Comms (internal+customer), Evidence gaps, Decision deadline;
    SCORE >= 0.8
  min_score: 0.8
  on_fail_n: 2
stop_conditions:
  on_success_n: 1
  max_latency_ms: 240000
  contains: ["Severity", "Mitigation", "Comms"]
stages:
  - id: memory_load
    kind: memory
    name: Load prior SEV context
  - id: router
    kind: router
    name: Route models
    route: local
  - id: commander_plan
    kind: planner
    name: IC plan
    prompt: |
      You are Incident Commander (planner only). Output a SHORT plan with numbered steps:
      1) Severity hypothesis (SEV-1/2/3) with one-line justification from given facts
      2) Blast-radius questions still unanswered
      3) Three parallel workstreams (mitigate / investigate / communicate)
      4) Explicit rollback vs mitigate fork criteria
      5) Decision deadline (minutes from now)
      Do not invent metrics. Flag unknowns as UNKNOWN.
  - id: parallel_actors
    kind: actor
    name: Parallel IC workstreams
    parallel: 3
    roles: [exec, research, plan]
    prompt: |
      You are one workstream lead under the IC PLAN. Stay in your role:
      - exec: Immediate mitigations + rollback commands (feature flag, pool, traffic shed)
      - research: Evidence checklist (DB, flag, deploy, PII exposure) and what to pull next
      - plan: Stakeholder matrix + status-page / exec update drafts
      Follow the PLAN. Cite only provided facts. Keep each workstream section under 180 words.
      Label your section with ROLE: <name>.
  - id: safety_critic
    kind: critic
    name: Safety + completeness critic
    eval_min: 0.8
    prompt: |
      You are the checker (not the maker). Score whether the merged brief is safe for a live
      SEV command channel. Penalize invented metrics, missing rollback fork, missing customer
      comms, or unclear decision deadline. Reply with exactly:
      SCORE: <0.0-1.0>
      REASON: <one short sentence>
  - id: memory_persist
    kind: memory
    name: Persist IC outcome
graph_edges:
  - id: e1
    source: memory_load
    target: router
    kind: flow
  - id: e2
    source: router
    target: commander_plan
    kind: flow
  - id: e3
    source: commander_plan
    target: parallel_actors
    kind: flow
  - id: e4
    source: parallel_actors
    target: safety_critic
    kind: flow
  - id: e5
    source: safety_critic
    target: memory_persist
    kind: flow
  - id: fb1
    source: safety_critic
    target: commander_plan
    kind: feedback
skill: enterprise-incident-command-v1
