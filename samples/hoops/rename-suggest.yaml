kind: hoop
id: rename-suggest
name: Rename suggest
goal: >
  Suggest 3 clearer names for a poorly named helper and pick one recommendation.
prompt: >
  Function name: doStuffWithThings
  Behavior: loads a YAML config file from disk, validates required keys, returns
  a typed Config struct or an error.
  Suggest three better names and recommend one. Keep the answer under 120 words.
route: local
learning: true
autonomy: L1
max_iterations: 2
fail_policy: stop
enabled: true
eval:
  min_score: 0.5
  goal: At least three candidate names and one clear recommendation.
stages:
  - kind: planner
    prompt: Think about naming conventions (verb+noun, load/parse/validate).
    route: local
  - kind: actor
    prompt: Output three names + one recommendation with a one-line reason each.
    route: local
  - kind: critic
    prompt: SCORE=0–1. Require ≥3 distinct names and an explicit recommendation.
    route: local
