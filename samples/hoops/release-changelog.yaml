kind: hoop
id: release-changelog
name: Release checklist and changelog
goal: |
  Prepare a release checklist and changelog for Glider 0.4.0 based on these notes:
  - Cytoscape graph editor with edgehandles and undo
  - Loop Engineering hoops with critic eval scores and hoop learning
  - Swarm fan-out (max 4) with CritiqueMerge
  - Per-instance agent logs over WebSocket
  - Docs site C1-C4 architecture pages
  Produce CHANGELOG entries (Added/Changed/Fixed) and a go/no-go critic gate.
route: local
learning: true
max_iterations: 2
autonomy: L1
human_gate: true
fail_policy: stop
eval:
  goal: Changelog has Added/Changed sections and critic SCORE >= 0.8
  min_score: 0.8
  on_fail_n: 1
stop_conditions:
  on_success_n: 1
  max_latency_ms: 120000
stages:
  - id: memory_load
    kind: memory
    name: Load notes
  - id: router
    kind: router
    name: Route
  - id: planner
    kind: planner
    name: Checklist plan
    prompt: Plan release checklist sections (tests, docs, samples, config flags) then changelog structure.
  - id: actor
    kind: actor
    name: Draft changelog
    prompt: |
      Follow the PLAN. Output:
      ## Checklist
      - [ ] items
      ## Changelog
      ### Added
      ### Changed
      ### Fixed
  - id: critic
    kind: critic
    name: Release gate
    eval_min: 0.8
    prompt: |
      You are the release gate. Score whether changelog + checklist are shippable.
      SCORE: <0.0-1.0>
      REASON: <one sentence>
  - id: memory_persist
    kind: memory
    name: Persist
graph_edges:
  - { id: e1, source: memory_load, target: router, kind: flow }
  - { id: e2, source: router, target: planner, kind: flow }
  - { id: e3, source: planner, target: actor, kind: flow }
  - { id: e4, source: actor, target: critic, kind: flow }
  - { id: e5, source: critic, target: memory_persist, kind: flow }
  - { id: fb1, source: critic, target: actor, kind: feedback }
