kind: hoop
id: parallel-actor
name: Parallel actor demo
goal: Propose two short alternative renames for a helper function, then pick the clearer one.
route: local
learning: true
max_iterations: 2
autonomy: L1
fail_policy: continue
enabled: true
eval:
  goal: At least one clear rename suggestion with a SCORE from the critic.
  min_score: 0.6
  on_success_n: 1
stages:
  - kind: router
    id: router
    name: router
  - kind: planner
    id: planner
    name: planner
    prompt: "List two candidate rename angles for a vague helper name. Do not pick yet."
  - id: context_seed
    kind: context
    name: Seed shared context
  - kind: actor
    id: actor
    name: actor
    parallel: 2
    # Default parallel_mode is fanout. To nest swarm.Runner instead:
    # parallel_mode: swarm
    roles: [exec, research]
    tools:
      - name: artifact_write
        kind: builtin
    prompt: |
      You are one of several workers. Propose one concrete rename with a one-line rationale.
      Prefer context_query / [context_digest] for shared goal/plan. Optional: artifact_write
      kind=out under runs/parallel-actor/out/ (bare paths ScopeRel to work/).
  - kind: critic
    id: critic
    name: critic
    eval_min: 0.6
graph_edges:
  - source: router
    target: planner
    kind: flow
  - source: planner
    target: context_seed
    kind: flow
  - source: context_seed
    target: actor
    kind: flow
  - source: actor
    target: critic
    kind: flow
  - source: critic
    target: planner
    kind: feedback
