kind: hoop
id: escalation-policy
name: Escalation policy design (on-call + SEV)
goal: |
  Design an escalation policy for a platform team running Glider + payments APIs. Constraints:
  follow-the-sun coverage (US + EU), SEV-1 page within 5 minutes, SEV-2 within 15, SEV-3 next
  business day; executive bridge only for SEV-1 customer-facing >30 minutes; legal notify if
  suspected PII exposure; vendor escalate to cloud provider after 20 minutes unresolved infra.
  Produce a policy doc: severity matrix, paging ladder, bridge rules, communication templates,
  and anti-patterns. Prefer local models. Critic must reject vague ladders.
route: local
learning: true
max_iterations: 3
autonomy: L1
human_gate: true
fail_policy: stop
eval:
  goal: Severity matrix + paging ladder + bridge rules + templates; SCORE >= 0.75
  min_score: 0.75
  on_fail_n: 2
stop_conditions:
  on_success_n: 1
  max_latency_ms: 180000
  contains: ["SEV-1", "Paging", "Bridge"]
stages:
  - id: memory_load
    kind: memory
    name: Load prior policy notes
  - id: router
    kind: router
    name: Route
  - id: policy_planner
    kind: planner
    name: Policy outline
    prompt: |
      Outline sections for an escalation policy: severity definitions, detection sources,
      paging ladder (L1->L2->IC->exec), vendor escalate, legal trigger, quiet hours, and review cadence.
      Call out ambiguities in the constraints as questions.
  - id: context_seed
    kind: context
    name: Seed shared policy context
  - id: policy_author
    kind: actor
    name: Draft policy
    parallel: 2
    # parallel_mode: swarm
    roles: [exec, plan]
    tools:
      - name: artifact_write
        kind: builtin
      - name: datetime
        kind: builtin
    prompt: |
      Write the policy from the PLAN. Use headings. Include one example escalation timeline for
      a SEV-1 checkout outage. Keep under 450 words. Be concrete (minutes, roles), not slogans.
      Prefer context_query / [context_digest] for shared goal/plan.
      Persist with artifact_write kind=out under runs/escalation-policy/out/
      (bare paths ScopeRel to work/).
  - id: policy_critic
    kind: critic
    name: On-call critic
    eval_min: 0.75
    prompt: |
      Checker only. Reject if paging times missing, SEV definitions vague, or no legal/PII path.
      SCORE: <0.0-1.0>
      REASON: <one short sentence>
  - id: memory_persist
    kind: memory
    name: Persist policy draft
graph_edges:
  - { id: e1, source: memory_load, target: router, kind: flow }
  - { id: e2, source: router, target: policy_planner, kind: flow }
  - { id: e3, source: policy_planner, target: context_seed, kind: flow }
  - { id: e3b, source: context_seed, target: policy_author, kind: flow }
  - { id: e4, source: policy_author, target: policy_critic, kind: flow }
  - { id: e5, source: policy_critic, target: memory_persist, kind: flow }
  - { id: fb1, source: policy_critic, target: policy_planner, kind: feedback }
skill: escalation-policy-v1
