kind: hoop
id: feeds-edge-mvp
name: Feeds edge MVP (producer → consumer seed)
goal: |
  Tiny demo of graph_edges kind=feeds. Producer stage writes a short finding;
  consumer stage must use the FEEDS block (producer summary) without re-deriving it.
route: local
max_iterations: 1
autonomy: L1
fail_policy: continue
eval:
  goal: Consumer cites the producer finding; SCORE >= 0.5
  min_score: 0.5
  on_success_n: 1
stop_conditions:
  on_success_n: 1
stages:
  - id: producer
    kind: actor
    name: Produce finding
    prompt: |
      Write exactly one line starting with FINDING: and a short security note
      (e.g. FINDING: missing rate limit on /login). No tools.
  - id: consumer
    kind: actor
    name: Consume feeds
    prompt: |
      You receive a FEEDS block from the producer stage when graph_edges kind=feeds.
      Quote the FINDING line and add one remediation sentence.
      Prefer FEEDS over inventing a new finding.
  - id: critic
    kind: critic
    name: Check citation
    eval_min: 0.5
# Control-flow is linear via stage order; feeds is data-only (skipped by WalkOrder).
graph_edges:
  - { id: f1, source: producer, target: consumer, kind: flow }
  - { id: feed1, source: producer, target: consumer, kind: feeds }
  - { id: f2, source: consumer, target: critic, kind: flow }
